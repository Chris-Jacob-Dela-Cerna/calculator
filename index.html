<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Calculator</title>
  </head>

  <body>
    <div class="about-container"></div>

    <div class="calculator-container">
      <div class="calculator">
        <div class="display">
          <div class="history-panel">
            <ol class="history">
              <li class="first item">
                <p class="expression box">1 + 2 * 3</p>
                <p class="divider box">=</p>
                <p class="answer box">7</p>
              </li>
              <li class="item">
                <p class="expression box">3 * 4 - 4</p>
                <p class="divider box">=</p>
                <p class="answer box">8</p>
              </li>
              <li class="item">
                <p class="expression box">19 * 3333333333333333333333333334 - 4</p>
                <p class="divider box">=</p>
                <p class="answer box">8</p>
              </li>
              <li class="item">
                <p class="expression box">3 * 4 - 4</p>
                <p class="divider box">=</p>
                <p class="answer box">8999999999999</p>
              </li>
              <li class="item">
                <p class="expression box">3 * 2 - 4</p>
                <p class="divider box">=</p>
                <p class="answer box">8</p>
              </li>
            </ol>
          </div>

          <div class="input-panel">
            <input class="input" id="input-box">
          </div>
        </div>

        <div class="keypad" id="calc-keypad">
          <div class="column">
            <button class="number button" id="7-button">7</button>
            <button class="number button" id="4-button">4</button>
            <button class="number button" id="1-button">1</button>
            <button class="number button" id="0-button">0</button>
          </div>

          <div class="column">
            <button class="number button" id="8-button">8</button>
            <button class="number button" id="5-button">5</button>
            <button class="number button" id="2-button">2</button>
            <button class="utility button" id="decimal-button">.</button>
          </div>

          <div class="column">
            <button class="number button" id="9-button">9</button>
            <button class="number button" id="6-button">6</button>
            <button class="number button" id="3-button">3</button>
            <button class="utility button" id="negative-button">( - )</button>
          </div>

          <div class="column">
            <button class="utility button" id="multiply-button">×</button>
            <button class="utility button" id="divide-button">÷</button>
            <button class="utility button" id="add-button">+</button>
            <button class="utility button" id="subtract-button">−</button>
          </div>

          <div class="column">
            <button class="utility button" id="clear-all-button">AC</button>
            <button class="utility button" id="clear-button">C</button>
            <button class="utility button" id="answer-button">Ans</button>
            <button class="equal utility button" id="equal-button">=</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
