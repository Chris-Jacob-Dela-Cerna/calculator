<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Calculator</title>
  </head>

  <body>
    <div class="about-container"></div>

    <div class="calculator-container">
      <div class="calculator">
        <div class="display">
          <div class="history-panel"></div>

          <div class="input-panel">
            <input id="input">
          </div>
        </div>

        <div class="keypad">
          <div class="column">
            <button class="number button">7</button>
            <button class="number button">4</button>
            <button class="number button">1</button>
            <button class="number button">0</button>
          </div>

          <div class="column">
            <button class="number button">8</button>
            <button class="number button">5</button>
            <button class="number button">2</button>
            <button class="utility button">.</button>
          </div>

          <div class="column">
            <button class="number button">9</button>
            <button class="number button">6</button>
            <button class="number button">3</button>
            <button class="utility button">( - )</button>
          </div>

          <div class="column">
            <button class="utility button">×</button>
            <button class="utility button">÷</button>
            <button class="utility button">+</button>
            <button class="utility button">-</button>
          </div>

          <div class="column">
            <button class="utility button">AC</button>
            <button class="utility button">C</button>
            <button class="utility button">Ans</button>
            <button class="equal utility button">=</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
